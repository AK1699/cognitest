name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cognitest
          POSTGRES_PASSWORD: cognitest
          POSTGRES_DB: cognitest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cognitest -d cognitest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://cognitest:cognitest@localhost:5432/cognitest
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      # must run before setup-node so the pnpm cache can resolve;
      # the pnpm version comes from the packageManager field
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm db:migrate

      - run: pnpm db:seed

      - run: pnpm test
