name: CI

on:
  push:
    branches: [main]
  # every PR runs CI regardless of its base — stacked branches included
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cognitest
          POSTGRES_PASSWORD: cognitest
          POSTGRES_DB: cognitest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cognitest -d cognitest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # runtime role (RLS applies) — created in the "create app role" step
      DATABASE_URL: postgres://cognitest_app:cognitest_app@localhost:5432/cognitest
      # owner role for migrations/seed (RLS bypass is intentional there)
      DATABASE_URL_MIGRATIONS: postgres://cognitest:cognitest@localhost:5432/cognitest
      REDIS_URL: redis://localhost:6379
      # no SMTP service in CI — empty host selects the no-op json transport
      MAIL_HOST: ''

    steps:
      - uses: actions/checkout@v4

      # must run before setup-node so the pnpm cache can resolve;
      # the pnpm version comes from the packageManager field
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      # non-owner runtime role; locally the compose init script creates it
      - name: create app role
        run: |
          psql "$DATABASE_URL_MIGRATIONS" -c \
            "CREATE ROLE cognitest_app LOGIN PASSWORD 'cognitest_app'"

      - run: pnpm db:migrate

      - run: pnpm db:seed

      - run: pnpm test
